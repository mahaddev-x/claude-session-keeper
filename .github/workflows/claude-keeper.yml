name: Claude Session Keeper

on:
  schedule:
    # Trigger at 08:00, 13:00, 18:00, 23:00 UTC daily (Every 5 hours)
    - cron: '0 8,13,18,23 * * *'
  workflow_dispatch: # Allows manual run from GitHub repository Actions tab

jobs:
  ping-claude:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Ping Claude Code to Start 5-Hour Window
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not set. Run 'claude setup-token' locally and add it."
            exit 1
          fi
          set -o pipefail
          claude -p "Hi" --dangerously-skip-permissions 2>&1 | tee out.txt
          if grep -qi "Not logged in\|Invalid API key\|authentication" out.txt; then
            echo "::error::Auth failed - token invalid or expired."
            exit 1
          fi
